<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winnway Studio｜內容管理</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap');:root{--ink:#251619;--wine:#7c2d38;--paper:#fbf7f0;--cream:#f2e9dc;--line:#dfd3c6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1060px;margin:auto;padding:45px 24px 80px}h1,h2{font-family:"Noto Serif TC",serif}h1{margin:0;font-size:34px}h2{font-size:22px;margin:0 0 18px}.lead{color:#71645e;margin:8px 0 30px}.notice{background:#eee3d5;border-left:4px solid var(--wine);padding:14px 16px;margin:22px 0}.toolbar,.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 28px}button,.file-label{border:1px solid var(--wine);background:#fff;color:var(--wine);padding:9px 13px;font:inherit;cursor:pointer}.primary{background:var(--wine);color:#fff}.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}.panel{background:#fff;border:1px solid var(--line);padding:25px;margin-top:20px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:grid;gap:5px;font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);background:#fff;font:inherit}textarea{min-height:110px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.hidden{display:none}.list{margin-top:28px;border-top:1px solid var(--line)}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item small{color:#756861}.delete{border-color:#b66767;color:#a33;background:#fff;padding:4px 8px;font-size:12px}.hint{font-size:12px;color:#756861}.status{color:#3b6d4b;font-weight:700}@media(max-width:650px){.fields{grid-template-columns:1fr}.wrap{padding:30px 18px}.full{grid-column:auto}}</style></head>
<body><main class="wrap"><h1>Winnway Studio｜內容管理</h1><p class="lead">在這裡新增酒款或紅酒百科，完成後下載內容檔並上傳到 GitHub。</p>
<div class="notice"><b>使用方式：</b>新增資料 → 按「下載內容檔」→ 到 GitHub 將 <code>winnway-content.json</code> 覆蓋上傳至與 <code>index.html</code> 相同的位置。新增酒瓶照片時，也請一併上傳照片檔；照片檔名必須和酒款資料中的照片檔名完全相同。</div>
<div class="toolbar"><button class="primary" id="export">下載內容檔</button><label class="file-label">匯入內容檔<input id="import" type="file" accept="application/json" hidden></label><button id="reset">放棄這次草稿</button><span class="status" id="status"></span></div>
<div class="tabs"><button class="tab active" data-tab="wine">新增酒款</button><button class="tab" data-tab="wiki">新增百科</button></div>
<section class="panel" id="winePanel"><h2>新增酒款</h2><form id="wineForm"><div class="fields">
<label>中文酒名<input name="name" required></label><label>英文酒名<input name="englishName" required></label><label>酒莊<input name="winery"></label><label>國家<input name="country" placeholder="例如：法國"></label><label>產區<input name="region" placeholder="例如：Burgundy / Gevrey-Chambertin"></label><label>葡萄品種<input name="grape"></label><label>價格<input name="price" placeholder="例如：NT$3,000–4,000"></label><label>照片檔名<input name="image" placeholder="例如：my-wine.png"></label><label>酒體（1–5）<input name="body" type="number" min="1" max="5"></label><label>單寧（1–5）<input name="tannin" type="number" min="1" max="5"></label><label>酸度（1–5）<input name="acidity" type="number" min="1" max="5"></label><label class="check"><input name="hasVintage" type="checkbox">此酒有年份與各年份價格</label><label class="full">香氣描述<input name="aroma"></label><label class="full">建議搭餐<input name="pairing"></label><label class="full">酒款故事／備註<textarea name="story"></textarea></label><label class="full">年份價格（選填）<textarea name="vintages" placeholder="每行一筆，例如：&#10;2021: NT$3,600&#10;2020: NT$3,200"></textarea><span class="hint">填寫後，侍酒師可依年份與預算推薦。</span></label>
</div><div class="toolbar"><button class="primary">加入酒款</button></div></form><div class="list" id="wineList"></div></section>
<section class="panel hidden" id="wikiPanel"><h2>新增紅酒百科</h2><form id="wikiForm"><div class="fields"><label>大分類<select name="category"><option>分級</option><option>名詞</option><option>產區</option><option>葡萄品種</option></select></label><label>小標題<input name="title" required placeholder="例如：香檳 Champagne"></label><label>排序（選填）<input name="order" type="number" placeholder="數字愈小愈前面"></label><label class="full">說明文字<textarea name="body" required placeholder="[小標題] 會顯示為加粗、放大的小標。&#10;/重點文字/ 會顯示為粗體。"></textarea></label></div><div class="toolbar"><button class="primary">加入百科</button></div></form><div class="list" id="wikiList"></div></section></main>
<script>const base={"wines":[{"id":"opus-one","order":1,"name":"第一樂章","englishName":"Opus One","winery":"Opus One Winery","country":"美國","region":"加州納帕谷 Oakville","grape":"波爾多混釀","body":1,"tannin":1,"acidity":1,"price":"NT$15,000–19,000","aroma":"黑醋栗、黑莓、雪松、烘烤咖啡豆、香草","pairing":"牛排、烤羊排、松露料理","story":"納帕谷指標性頂級波爾多混釀；多數年份可存放 20–40 年。","image":"opus-one.png","hasVintage":false},{"id":"opus-one-overture","order":2,"name":"第一樂章序曲","englishName":"Opus One Overture","winery":"Opus One Winery","country":"美國","region":"加州納帕谷","grape":"Red Blend","body":1,"tannin":1,"acidity":1,"price":"NT$5,500–6,600","aroma":"黑莓、黑醋栗、紅醋栗、橡木桶木香","pairing":"牛肉起司漢堡、炭烤羊排、紅燒牛小排","story":"Overtuer保留Opus One的特性，將每年剩餘的酒液在法國橡木桶内存放更長時間後，調配混釀出Overture，可視為Opus One的延伸。","image":"opus one overture.png","hasVintage":false},{"id":"caymus-napa-cabernet","order":3,"name":"凱慕斯納帕谷卡本內","englishName":"Caymus Napa Valley Cabernet Sauvignon","winery":"Caymus Vineyards","country":"美國","region":"Napa Valley","grape":"Cabernet Sauvignon","body":1,"tannin":1,"acidity":1,"price":"2900","aroma":"成熟果香、香草、牛奶巧克力","pairing":"紅肉料理","story":"果味奔放、單寧柔順，接受度高。","image":"caymus.png","hasVintage":false},{"id":"caymus-special-selection","order":4,"name":"凱慕斯精選","englishName":"Caymus Special Selection","winery":"Caymus Vineyards","country":"美國","region":"Napa Valley","grape":"Cabernet Sauvignon","body":1,"tannin":1,"acidity":1,"price":"NT$12,700–15,200","aroma":"濃郁果香、雪松、皮革、菸草、乾果、咖啡豆","pairing":"紅肉料理","story":"旗艦款，只在極佳年份生產。","image":"Caymus Special Selection.png","hasVintage":false},{"id":"caymus-suisun","order":5,"name":"凱慕斯蘇辛谷卡本內","englishName":"Caymus-Suisun Cabernet Sauvignon","winery":"Caymus Vineyards","country":"美國","region":"Suisun Valley","grape":"Cabernet Sauvignon","body":1,"tannin":1,"acidity":1,"price":"2300","aroma":"成熟果香、大地、泥土、胡椒、香料","pairing":"燉肉、煙燻料理","story":"較納帕谷款多一份野性。","image":"Caymus-Suisun.png","hasVintage":false},{"id":"montes-alpha-cabernet","order":6,"name":"蒙帝斯阿法卡本內","englishName":"Montes Alpha Cabernet Sauvign 成，分別象徵觸、味、聽、視、嗅、思維等六個感官知覺","image":"Amon-Ra.png","hasVintage":true},{"id":"dom-perignon","order":30,"name":"唐培里儂香檳王","englishName":"Dom Perignon Vintage Brut","winery":"Dom Perignon","country":"法國","region":"Champagne","grape":"61% Chardonnay、39% Pinot Noir","body":1,"tannin":1,"acidity":1,"price":"NT$7,500–10,000","aroma":"奶油蛋捲、烤堅果","pairing":"海鮮、烤肉、牛排","story":"香檳王只使用一級園與特級園葡萄鮮榨第一道果汁釀製，並窖藏至少三年，而經典款的香檳王，更是歷經七年窖藏才能裝瓶。\n*當今名氣最大的超頂尖香檳名牌之一，譽為「世界上最偉大的酒款」之一","image":"Dom Perignon Vintage Brut.png","hasVintage":true}],"vintagesByWine":{"leoville-barton":[{"year":"2023","price":"3210"},{"year":"2022","price":"3380"},{"year":"2021","price":"2910"},{"year":"2018","price":"3470"},{"year":"2017","price":"3950"},{"year":"2016","price":"5730"},{"year":"2015","price":"4410"},{"year":"2014","price":"3640"},{"year":"2012","price":"4000"},{"year":"2012","price":"3860"},{"year":"2010","price":"10330"},{"year":"2009","price":"5720"},{"year":"2006","price":"4300"},{"year":"2005","price":"6190"},{"year":"2003","price":"7160"},{"year":"2000","price":"9470"},{"year":"1999","price":"6910"},{"year":"1998","price":"5440"},{"year":"1994","price":"7500"},{"year":"1989","price":"10710"},{"year":"1982","price":"19000"},{"year":"1982","price":"19140"}],"montes-alpha-cabernet":[{"year":"2022","price":"1050"},{"year":"2020","price":"1190"}],"montes-alpha-m":[{"year":"2020","price":"3250"},{"year":"2011","price":"2900"},{"year":"2010","price":"2900"},{"year":"2009","price":"2900"}],"montes-folly-syrah":[{"year":"2020","price":"3440"},{"year":"2019","price":"3045"},{"year":"2017","price":"3000"},{"year":"2012","price":"3150"},{"year":"2010","price":"2600"},{"year":"2009","price":"2900"}],"montes-purple-angel":[{"year":"2021","price":"3200"},{"year":"2020","price":"4300"},{"year":"2019","price":"3400"}],"robert-mondavi-oakville":[{"year":"2022","price":"3500"},{"year":"2021","price":"4250"},{"year":"2019","price":"2800"},{"year":"2014","price":"3450"}],"robert-mondavi-napa":[{"year":"2022","price":"20 r":"2017","price":"907"},{"year":"2016","price":"1133"},{"year":"2015","price":"875"},{"year":"2014","price":"842"},{"year":"2013","price":"712"},{"year":"2012","price":"1846"},{"year":"2011","price":"1393"},{"year":"2010","price":"1070"}],"lu-ceppu-negroamaro":[{"year":"2025","price":"420"},{"year":"2023","price":"420"},{"year":"2022","price":"388"},{"year":"2021","price":"388"},{"year":"2020","price":"518"},{"year":"2019","price":"290"},{"year":"2015","price":"1425"},{"year":"2013","price":"907"},{"year":"2012","price":"647"},{"year":"2011","price":"583"},{"year":"2010","price":"420"},{"year":"2009","price":"290"}],"penfolds-bin-389":[{"year":"2026","price":"3760"},{"year":"2023","price":"2400"},{"year":"2022","price":"2460"},{"year":"2021","price":"2460"},{"year":"2020","price":"2332"},{"year":"2019","price":"2105"},{"year":"2018","price":"2400"},{"year":"2017","price":"2200"},{"year":"2016","price":"2460"},{"year":"2015","price":"2400"},{"year":"2014","price":"2720"},{"year":"2013","price":"2980"},{"year":"2012","price":"3368"},{"year":"2011","price":"2980"}],"amon-ra":[{"year":"2023","price":"1811"},{"year":"2021","price":"2167"},{"year":"2020","price":"2620"},{"year":"2019","price":"3300"},{"year":"2018","price":"2652"},{"year":"2017","price":"2522"},{"year":"2016","price":"2522"},{"year":"2015","price":"2522"},{"year":"2014","price":"2716"},{"year":"2013","price":"3040"},{"year":"2012","price":"3363"},{"year":"2011","price":"2460"},{"year":"2010","price":"3428"},{"year":"2009","price":"3040"}],"dom-perignon":[{"year":"2021","price":"5530"},{"year":"2018","price":"5757"},{"year":"2017","price":"6762"},{"year":"2015","price":"8086"},{"year":"2014","price":"7730"},{"year":"2013","price":"8289"},{"year":"2012","price":"9088"},{"year":"2010","price":"10034"},{"year":"2009","price":"9685"},{"year":"2008","price":"14790"},{"year":"2006","price":"11080"},{"year":"2005","price":"10511"},{"year":"2004","price":"8571"},{"year":"2003","price":"9336"},{"year":"2002","price":"11430"}]},"wiki":[{"category":"分級","title":"布根地分級制度","body":"由高至低為 Grand Cru、Premier Cru、Village、Regional；等級反映土地稀有性與官方分級。","order":4},{"category":"分級","title":"波爾多酒莊內部酒款分級制","body":"1855 年分級依酒莊歷史聲譽與市場交易價格區分為五級；酒莊內部亦常有一軍、二軍、三軍酒的產品分級。\n一軍酒--代表該酒莊最頂級的產品，釀造葡萄通常嚴選自酒莊內樹齡最老、品質最好、日照與排水最完美的核心精華地塊。產量最少、價格最高，具極高的陳年力。\n二軍酒--又稱副牌酒，將釀造一軍酒時篩選下的葡萄釀成，葡萄藤相較年輕，果實風味單薄。 價格通常只要一軍酒的幾分之一，且不須待陳年即可品嘗。\n三軍酒--使用更年輕的葡萄藤，或是二軍酒挑剩的果實， 較少酒莊推出三軍酒(僅少數頂級大酒莊)，風格更為輕盈、易飲，價格也最為平實，但相對地，名莊的複雜度與結構感就會大幅降低。","order":5},{"category":"分級","title":"波爾多列級酒莊","body":"分作一級酒莊、二級酒莊、三級酒莊 、四級酒莊 、五級酒莊 \n背景：法國皇帝拿破崙三世為了舉辦巴黎萬國博覽會，要求波爾多商會對當地的頂級葡萄酒進行分級，評選標準主要基於酒莊的歷史聲譽與長期的市場交易價格，酒莊由高至低分為五個級別。\n*任何有被評級的酒莊都被視為列級酒莊，它們在當時甚至到現今，都被認為是波爾多最好的生產商","order":999},{"category":"名詞","title":"單寧","body":"單寧主要來自葡萄皮、籽、梗與橡木桶的酚類化合物；它不是味道，而是讓口腔感到收斂與澀感的物理感覺。","order":1},{"category":"名詞","title":"Domaine","body":"Domaine 是法國常見的酒莊用語，通常代表酒莊擁有葡萄園，並自行完成種植、釀造與裝瓶。","order":3},{"category":"名詞","title":"Caymus系列","body":"Caymus Vineyards 是美國納帕谷（Napa Valley）極具代表性的酒莊，所有 Caymus 品牌的酒，背後的核心都是 Wagner 家族。現在雖然產品線擴展，但它們的核心技術與選果哲學都源自這個家族。納帕谷的經典風格，無論是標準款、Special Selection，還是 Suisun 支線，它們都遵循極致成熟的果香，柔順的單寧，香草、烘烤咖啡、可可與甜香料的氣息。Caymus 的招牌就是 Cabernet Sauvignon，為了達成上述那種「甜美、厚實、圓潤」的風格，在選果上追求果實極致成熟(葡萄在藤上的懸掛時間比一般酒莊更長)，並統一釀製橡木桶","order":9},{"category":"名詞","title":"IGT 地理標示保護","body":"IGT 是義大利葡萄酒法定分級制度中的一個重要級別，全名為 Indicazione Geografica Tipica，中文通常翻譯為 「地理標示保護」。\n義大利葡萄酒在 1970 年代以前因法規僵化，迫使前衛酒莊將混入國際品種的頂級好酒降級為普通餐酒。這群「叛逆」酒款大獲成功，掀起「超級托斯卡納」風潮，促使義大利官方於 1992 年正式創立 IGT 等級，給予頂級創新酒款合理的身份。\n\nIGT 擁有寬鬆的地理範圍與極大的釀酒自由度，讓酒莊能突破傳統法規框架。雖然在法定分級上低於 DOCG 與 DOC，但它不等於廉價酒，許多世界上最昂貴的傳奇名酒（如 Sassicaia 與 Tignanello）過去皆掛有此級別。","order":10},{"category":"產區","title":"波爾多左岸與右岸","body":"左岸以礫石土壤與 Cabernet Sauvignon 為主，通常酒體強勁、單寧豐富；右岸多為黏土與石灰岩、以 Merlot 為主，口感較圓潤。","order":2},{"category":"產區","order":3,"title":"納帕谷 Napa Valley","body":"位於美國加州，是新世界葡萄酒最頂級且具代表性的產區（美國第一個 AVA 認證產區）。雖然長度僅約 30 英里，卻因獨特的谷地與山坡地形，孕育出極為豐富的微氣候。\n\n[產區地形與次產區（Sub-AVAs）]\n納帕谷大致可分為「谷底區（Valley Floor）」與「山坡區（Mountain AVAs）」：\n/谷底區：/如 Rutherford、Oakville、Stags Leap District，日照充足，土壤肥沃，產出的酒款風格飽滿圓潤、果香奔放、單寧成熟。\n/山坡區：/如 Howell Mountain、Mount Veeder、Spring Mountain，晝夜溫差大且產量稀少，生產的葡萄酒酸度較高、單寧緊實，具備極強的陳年潛力。\n\n[代表品種與風格]\n/卡本內蘇維濃（Cabernet Sauvignon）：/絕對的主角，佔全區產量絕大多數，呈現濃郁黑醋栗、黑櫻桃、香草與黑巧克力風味。\n/其他品種：/Merlot、Chardonnay、Zinfandel 等。"},{"category":"產區","order":4,"title":"托斯卡尼 Toscana","body":"位於義大利中部，是義大利最著名的葡萄酒產區之一。此區以丘陵起伏的優美景致與極具在地特色的原生地酒款聞名。\n\n[核心次產區與酒款類型]\n/古典奇揚地（Chianti Classico DOCG）：/托斯卡尼的核心產區，以至少 80% 山吉歐維榭（Sangiovese）釀造，具高酸度與酸櫻桃、泥土香氣。\n/蒙塔奇諾布魯內洛（Brunello di Montalcino DOCG）：/採用 100% Sangiovese Grosso 釀造，酒體龐大、單寧扎實，經過嚴格桶陳，具備強大陳年實力。\n/超級托斯卡尼（Super Tuscans）：/1970 年代起釀酒師突破傳統法規限制的創新葡萄酒（如 Sassicaia、Tignanello）。常混釀 Cabernet Sauvignon、Merlot 等國際品種，大多標示為 Toscana IGT，品質極高且售價昂貴。\n\n[核心品種]\n以原生的山吉歐維榭（Sangiovese）為靈魂，搭配波爾多國際品種（Cabernet Sauvignon、Merlot）釀造。"},{"category":"產區","order":5,"title":"里奧哈 Rioja","body":"位於西班牙北部，是西班牙最古老且地位最高貴的產區（獲頒最高的 DOCa 級別）。里奧哈以傳統橡木桶陳年分級與細緻柔和的口感著稱。\n\n[三大子產區（Sub-regions）]\n/高里奧哈（Rioja Alta）：/海拔較高，氣候較涼爽，產出的葡萄酒酸度高、結構細緻優雅。\n/阿拉維斯里奧哈（Rioja Alavesa）：/大西洋氣候影響較大，酒體較輕盈，果香清新且花香迷人。\n/東里奧哈（Rioja Oriental／原 Rioja Baja）：/氣候溫暖乾燥，以歌海娜（Garnacha）為主，酒體飽滿且酒精度較高。\n\n[傳統陳年分級體系]\n里奧哈依據在橡木桶與瓶中陳年的時間長短，分為四個主要等級：\n/1. Garantía de Origen（Joven）：/新鮮年輕，未經桶陳或極短時間桶陳。\n/2. Crianza：/至少陳年 2 年（含至少 1 年橡木桶）。\n/3. Reserva：/至少陳年 3 年（含至少 1 年橡木桶 + 6 個月瓶陳）。\n/4. Gran Reserva：/僅在優秀年份生產，至少陳年 5 年（含至少 2 年橡木桶 + 2 年瓶陳）。\n近年亦新增以單一葡萄園為導向的 Viñedo Singular 頂級認證。\n\n[代表品種與風格]\n以田帕尼優（Tempranillo）為主，輔以 Garnacha、Graciano 與 Mazuelo 混釀。因傳統常使用美式橡木桶，常帶有椰子、香草、皮革與香料風味。"},{"category":"葡萄品種","order":1,"title":"卡本內蘇維濃 Cabernet Sauvignon","body":"原產自法國波爾多(Bordeaux)產區，屬於晚熟且適應力極強的品種，被譽為「紅葡萄之王」。和 Merlot 相比，Cabernet Sauvignon 擁有更高的酸度與強勁厚實的單寧，酒體豐滿、結構嚴謹，並具備極佳的陳年潛力，也是全球混釀紅酒最核心的基底品種之一。\n卡本內蘇維濃的結構感鮮明且標誌性極強，常見香氣包含黑醋栗、黑櫻桃、青椒、雪松、煙草、墨水與香草，並依產區氣候、採收成熟度與橡木桶陳年時間，呈現出從高雅精緻到濃郁奔放的多層次風味。\n\n[起源與主要產區]\nCabernet Sauvignon 卡本內蘇維濃會因種植地區而展現不同表情：涼爽或中性產區（如法國左岸 Médoc）通常帶有更高酸度、緊實單寧與標誌性的草本青椒與雪松香氣；溫暖產區（如美國加州 Napa Valley 或澳洲 Coonawarra）則常有極成熟的黑醋栗果醬風味、較高的酒體與豐潤厚實的單寧口感。\n\n[適飲場合]\nCabernet Sauvignon 卡本內蘇維濃適合用於正式晚宴、高端品酒會、重磅紅酒主題選酒或具備長期陳年潛力的名酒收藏，搭餐可考慮上等肋眼牛排、烤羊腿、燉牛膝、帶骨肋排與熟成硬質起司。"},{"category":"葡萄品種","order":2,"title":"梅洛 Merlot","body":"原產自法國波爾多(Bordeaux)產區，早熟且產量大。和 Cabernet Sauvignon 比起來，Merlot 有更多的果香，酒精含量高，單寧較為柔順，口感以圓潤厚實為主，酸度也比較低，一般讓葡萄酒新手較能接受。\n梅洛的結構感、果香與單寧表現鮮明，常見香氣包含黑莓、櫻桃、李子、香料、皮革與木質，並依產區氣候、採收成熟度、發酵方式與橡木桶使用比例，呈現不同層次與風味細節。\n\n[起源與主要產區]\nMerlot 梅洛會因種植地區而展現不同表情：涼爽產區通常帶來更高酸度、細緻香氣與清爽線條；溫暖產區則常有較成熟的果味、酒體與口感厚度。不同國家與產區的風土，也會讓同一品種呈現截然不同的個性。\n\n[適飲場合]\nMerlot 梅洛適合用於紅酒、混釀紅酒、橡木桶熟成酒款或產區代表酒的選酒情境，搭餐可考慮牛排、烤肉、燉肉、番茄醬汁料理與熟成起司。"},{"category":"葡萄品種","order":3,"title":"黑皮諾 Pinot Noir","body":"原產自法國勃根地(Bourgogne)產區，屬於早熟且對氣候與土壤極度敏感的高貴品種（常被稱為「最難伺候的葡萄」）。和 Cabernet Sauvignon 相比，Pinot Noir 的皮薄、酒色較淺，酸度偏高但單寧較為細緻柔和，酒體中等至輕盈，以無與倫比的優雅感與極其複雜的香氣變化著稱。\n黑皮諾的果香與地貌風味表現極為優雅細緻，常見香氣包含紅櫻桃、覆盆子、草莓、玫瑰花香、丁香，隨著陳年更會發展出蕈菇、森林地表、乾葉與皮革等迷人的熟成韻味。\n\n[起源與主要產區]\nPinot Noir 黑皮諾高度依賴涼爽氣候：涼爽產區（如法國勃根地金丘、紐西蘭 Central Otago、美國俄勒岡州 Oregon）能保留優雅高酸與極其優美純淨的紅果香與花香；若在過於炎熱的地區則容易失去酸度與精緻感。不同微氣候與地質的坡地，會讓黑皮諾展現出截然不同的風土個性。\n\n[適飲場合]\nPinot Noir 黑皮諾適合用於精細法式餐酒會、輕食午宴、頂級黑皮諾垂直品鑑或高雅個人獨飲情境，搭餐可考慮法式燉雞（Coq au Vin）、油封鴨腿、烤鮭魚、櫻桃鴨胸、野菇料理與軟質 Brie 起司。"},{"category":"葡萄品種","order":4,"title":"希哈 Syrah／Shiraz","body":"原產自法國隆河谷(Rhône Valley)產區（在澳洲稱為 Shiraz）。屬於中晚熟品種，釀出的酒款通常呈深濃的寶石紅或紫紅色。Syrah 擁有飽滿的酒體、中高酸度與扎實而滑順的單寧，以濃郁的黑果香氣與獨特的辛香料感著稱。\n希哈的個性鮮明且風味豐富，常見香氣包含黑莓、藍莓、黑胡椒、煙燻肉乾、紫羅蘭、甘草與皮靴香味，並依釀造工藝與陳年方式，展現出從冷涼細緻的野性辛香到溫暖奔放的果香甜美感。\n\n[起源與主要產區]\nSyrah／Shiraz 希哈在不同名稱與產區下展現截然不同的性格：舊世界涼爽產區（如法國北隆河 Hermitage 或 Côte-Rôtie，稱 Syrah）強調黑胡椒、紫羅蘭、煙燻感與優雅高酸；新世界溫暖產區（如澳洲 Barossa Valley，稱 Shiraz）則以爆發力十足的黑莓果醬、巧克力和甜美濃郁的酒體聞名。\n\n[適飲場合]\nSyrah／Shiraz 希哈適合用於美式／韓式燒烤聚會、冬日燉肉餐會、香料主題選酒或派對慶祝，搭餐可考慮黑胡椒牛排、烤羊排、野味料理、德式香腸、煙燻燒烤肉類與藍起司。"},{"category":"葡萄品種","order":5,"title":"山吉歐維榭 Sangiovese","body":"原產自義大利托斯卡尼(Tuscany)產區，屬於晚熟型品種。和 Cabernet Sauvignon 相比，Sangiovese 擁有更鮮明的酸度與中高單寧，酒體中等至豐滿。其口感帶著極佳的結構感，能完美平衡果酸與油脂感，是義大利傳統餐酒文化的核心靈魂。山吉歐維榭的果香與泥土氣息表現突出，常見香氣包含酸櫻桃、紅李、乾草、煙草、皮革與泥土香，並依採收成熟度、海拔高度與橡木桶使用比例，展現出從清爽純粹到濃郁複雜的多樣層次。\n\n[起源與主要產區]\nSangiovese 山吉歐維榭會因種植地區而展現不同表情：涼爽或高海拔產區（如 Chianti Classico 高地）通常帶來更高酸度、細緻花香與清爽線條；溫暖產區（如 Maremma 或部分 Brunello di Montalcino 園區）則常有較成熟的黑果味、酒體與扎實的單寧結構。\n\n[適飲場合]\nSangiovese 山吉歐維榭適合用於義式餐酒會、日常聚餐、經典產區代表酒選酒或具備陳年潛力的名酒收藏，搭餐可考慮紅醬義大利麵、拿坡里披薩、烤羊排、燉牛肉與硬質起司。\n\n[風味特徵]\n．田野番茄和皮革：傳統的生產方式採用舊橡木桶進行陳化，以免為山吉歐維榭帶來新桶的香草風味，而維持固有的草本風味與高酸度。\n．櫻桃和丁香：現代版的山吉歐維榭紅酒利用橡木桶培養，醞釀出甜香草風味並讓酸度更柔和。"},{"category":"葡萄品種","order":6,"title":"內比歐露 Nebbiolo","body":"原產自義大利西北部的皮埃蒙特(Piedmont)產區，屬於極為晚熟且對風土高度敏感的品種。Nebbiolo 的酒色通常較淺，呈透亮的磚紅或寶石紅色，但卻擁有極高的酸度與強勁扎實的單寧，酒體結構龐大，具備極卓越的陳年潛力，需時間熟化以展現其柔和細緻的一面。內比歐露以獨特的香氣組合著稱，常見香氣包含酸櫻桃、乾燥玫瑰花香、松露、皮革、焦油與煙草，隨著瓶中陳年，會漸漸發展出更豐富複雜的蕈菇與泥土風味。\n\n[起源與主要產區]\nNebbiolo 內比歐露主要集中於皮埃蒙特，其中以 Barolo 和 Barbaresco 兩個頂級產區最為聞名。該品種極度挑剔微氣候，在日照充足、排水良好且日夜溫差大的丘陵陡坡上表現最佳；涼爽年份會帶來細緻優雅的花香與極高酸度，溫暖年份則展現更豐富的果香與飽滿酒體。\n\n[適飲場合]\nNebbiolo 內比歐露適合用於正式晚宴、高端品酒會、週年紀念酒款或頂級葡萄酒收藏情境，搭餐可考慮松露料理、燉牛膝（Ossobuco）、鹿肉、高脂肪紅肉與熟成硬質起司。"},{"category":"葡萄品種","order":7,"title":"田帕尼優 Tempranillo","body":"原產自西班牙里奧哈(Rioja)與杜耶羅河岸(Ribera del Duero)等產區，名稱源自西班牙文「早熟」（Temprano），屬於早熟型品種。Tempranillo 擁有適中的酸度與中等至偏高的單寧，酒體飽滿且結構良好，非常適合進行橡木桶陳年，能很好地吸收桶香而不失原本的果香特色。田帕尼優的風味兼具紅果與橡木影響，常見香氣包含紅櫻桃、黑李、無花果、香草、煙草、皮革與雪松，並依橡木桶類型（美式桶帶來香草椰子香，法式桶帶來香料木質香）與陳年等級（Crianza、Reserva、Gran Reserva）呈現截然不同的成熟韻味。\n\n[起源與主要產區]\nTempranillo 田帕尼優是西班牙的國寶級紅葡萄品種，在不同產區有不同別名（如 Toro 區的 Tinta de Toro）。高海拔涼爽產區能保留良好酸度與清新紅果香；而日照強烈、溫差大的溫暖產區則會賦予其黑果香氣、高酒精度的濃郁酒體與厚實單寧。\n\n[適飲場合]\nTempranillo 田帕尼優適合用於西班牙 Tapas 聚會、美式燒烤派對、傳統橡木桶陳年紅酒主題選酒，搭餐可考慮西班牙伊比利火腿、烤羊排、海鮮肉類雙拼燉飯、中式醬燒料理與中度熟成起司。"},{"category":"葡萄品種","order":8,"title":"馬爾貝克 Malbec","body":"原產自法國西南部（如 Cahors 產區），並在阿根廷門多薩(Mendoza)發揚光大。Malbec 屬於中晚熟品種，釀出的葡萄酒通常呈深邃濃郁的紫紅色。與 Cabernet Sauvignon 相比，Malbec 的單寧較為圓潤軟化，口感滑順飽滿，酒體厚實且酸度適中，一般大眾與葡萄酒新手的接受度極高。馬爾貝克的果香極為奔放且色澤鮮豔，常見香氣包含黑莓、藍莓、黑櫻桃、紫羅蘭花香、可可、煙燻與香草，依據產區海拔與釀造方式，展現出從純粹爆發的果香到細緻多層次的木質風味。\n\n[起源與主要產區]\nMalbec 馬爾貝克在不同國度的風土下展現出強烈對比：原產地法國 Cahors 氣候較涼爽，生產的 Malbec（當地稱為 Côt）風格較為硬朗、單寧高且帶有泥土感；而在阿根廷 Mendoza 高海拔、強日照的溫暖環境下，則呈現出標誌性的濃郁黑果香、柔順單寧與天鵝絨般的絲滑口感。\n\n[適飲場合]\nMalbec 馬爾貝克適合用於美式 BBQ 燒烤派對、朋友輕鬆聚會、新手入門紅酒選酒或歡慶情境，搭餐可考慮阿根廷烤肉（Asado）、肋眼牛排、美式漢堡、香料烤豬肉與藍起司。"},{"category":"葡萄品種","order":9,"title":"夏多內 Chardonnay","body":"原產自法國勃根地(Bourgogne)產區，適應力極強且屬於早熟型白葡萄品種。Chardonnay 本身並無過於強烈的獨特品種香氣（被稱為「釀酒師的白紙」），但極易受到氣候風土與釀造工藝（如橡木桶熟成、蘋果酸乳酸發酵、酒渣接觸）影響，能塑造出從乾爽清脆到濃郁奶油感等多樣化的風格。夏多內的風味光譜非常廣泛，常見香氣在涼爽產區呈現青蘋果、檸檬、葡萄柚與礦物感；在溫暖產區呈現水蜜桃、鳳梨與芒果等熱帶水果香；若經過橡木桶陳年與乳酸發酵，則會發展出奶油、榛果、香草與烘焙吐司的濃郁層次。\n\n[起源與主要產區]\nChardonnay 夏多內遍佈全球各大產區：涼爽產區（如法國 Chablis 或香檳區）帶來高酸度、精緻礦物感與清亮線條；溫暖產區（如美國加州 Napa Valley 或澳洲部分產區）則呈現成熟熱帶果香、飽滿圓潤的酒體與濃郁的橡木桶風味。\n\n[適飲場合]\nChardonnay 夏多內適合用於海鮮饗宴、白肉餐酒會、高級開胃酒選擇或慶祝場合，搭餐可考慮奶油干貝、清蒸或烤龍蝦、烤雞、焗烤海鮮與布里（Brie）或卡門貝爾（Camembert）等軟質起司。"}]};const key='winnway-admin-draft-v1';let data=JSON.parse(localStorage.getItem(key)||'null')||base;const clone=v=>JSON.parse(JSON.stringify(v));const save=()=>{localStorage.setItem(key,JSON.stringify(data));document.querySelector('#status').textContent='已儲存為這台裝置的草稿'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelector('#wineList').innerHTML='<h2>目前酒款（'+data.wines.length+'）</h2>'+data.wines.map(w=>'<div class="item"><span><b>'+esc(w.name)+'</b>　'+esc(w.englishName)+'<br><small>'+esc(w.region||'未填產區')+'</small></span><button class="delete" data-delete-wine="'+esc(w.id)+'">移除</button></div>').join('');document.querySelector('#wikiList').innerHTML='<h2>目前百科（'+data.wiki.length+'）</h2>'+data.wiki.map((w,i)=>'<div class="item"><span><b>'+esc(w.category)+'｜'+esc(w.title)+'</b></span><button class="delete" data-delete-wiki="'+i+'">移除</button></div>').join('');document.querySelectorAll('[data-delete-wine]').forEach(b=>b.onclick=()=>{if(confirm('確定移除這支酒？')){const id=b.dataset.deleteWine;data.wines=data.wines.filter(w=>w.id!==id);delete data.vintagesByWine[id];save();render()}});document.querySelectorAll('[data-delete-wiki]').forEach(b=>b.onclick=()=>{if(confirm('確定移除這則百科？')){data.wiki.splice(Number(b.dataset.deleteWiki),1);save();render()}})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#winePanel').classList.toggle('hidden',b.dataset.tab!=='wine');document.querySelector('#wikiPanel').classList.toggle('hidden',b.dataset.tab!=='wiki')});
document.querySelector('#wineForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const name=f.get('name').trim();const english=f.get('englishName').trim();const id=(english||name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'wine-'+Date.now();if(data.wines.some(w=>w.id===id)){alert('此英文名稱產生的 ID 已存在，請在英文酒名後補上年份或系列名稱。');return}const wine={id,order:Math.max(0,...data.wines.map(w=>Number(w.order)||0))+1,name,englishName:english,winery:f.get('winery').trim(),country:f.get('country').trim(),region:f.get('region').trim(),grape:f.get('grape').trim(),body:Number(f.get('body'))||null,tannin:Number(f.get('tannin'))||null,acidity:Number(f.get('acidity'))||null,price:f.get('price').trim(),aroma:f.get('aroma').trim(),pairing:f.get('pairing').trim(),story:f.get('story').trim(),image:f.get('image').trim(),hasVintage:f.get('hasVintage')==='on'};data.wines.push(wine);const vintages=f.get('vintages').split(/\r?\n/).map(line=>line.split(':')).filter(p=>p.length>=2&&p[0].trim()&&p.slice(1).join(':').trim()).map(p=>({year:p[0].trim(),price:p.slice(1).join(':').trim()}));if(vintages.length)data.vintagesByWine[id]=vintages;save();e.currentTarget.reset();render();alert('已加入酒款。完成所有新增後，請下載內容檔。')};
document.querySelector('#wikiForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);data.wiki.push({category:f.get('category'),title:f.get('title').trim(),body:f.get('body').trim(),order:Number(f.get('order'))||999});data.wiki.sort((a,b)=>a.category.localeCompare(b.category,'zh-Hant')||a.order-b.order);save();e.currentTarget.reset();render();alert('已加入百科。完成所有新增後，請下載內容檔。')};
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='winnway-content.json';a.click();URL.revokeObjectURL(a.href);document.querySelector('#status').textContent='內容檔已下載'};document.querySelector('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!Array.isArray(imported.wines)||!Array.isArray(imported.wiki)||!imported.vintagesByWine)throw Error();data=imported;save();render();alert('已匯入內容檔。')}catch{alert('這不是正確的 Winnway 內容檔。')}};document.querySelector('#reset').onclick=()=>{if(confirm('確定放棄這台裝置尚未下載的草稿？')){localStorage.removeItem(key);data=clone(base);save();render()}};render();</script></body></html>
