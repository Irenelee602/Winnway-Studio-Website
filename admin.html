<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winnway Studio｜內容管理</title>
<style>
:root{--ink:#251619;--wine:#7c2d38;--paper:#fbf7f0;--cream:#f2e9dc;--line:#dfd3c6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:38px 22px 80px}h1,h2{font-family:Georgia,"Noto Serif TC",serif}h1{margin:0;font-size:34px}.lead,.hint{color:#746761}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:12px 0 26px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--wine);background:#fff;color:var(--wine);padding:9px 13px;font:inherit;cursor:pointer}.primary,.tab.active{background:var(--wine);color:#fff}.panel{background:#fff;border:1px solid var(--line);padding:24px;margin-top:18px}.hidden{display:none}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}label{display:grid;gap:5px;font-size:13px;font-weight:700}input,textarea,select{width:100%;border:1px solid var(--line);padding:10px;background:#fff;font:inherit}textarea{min-height:110px}.list{border-top:1px solid var(--line);margin-top:22px}.item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.item small{color:#756861}.status{font-weight:700;color:#356444}.history{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:680px){.fields{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:28px 16px}}
</style>
<main class="wrap"><h1>Winnway Studio｜內容管理</h1><p class="lead">在這裡新增或修改酒款與紅酒百科；按下儲存後，正式網站會立即同步。</p>
<div class="bar"><div class="tabs"><button class="tab active" data-tab="wine">酒款管理</button><button class="tab" data-tab="wiki">百科管理</button><button class="tab" data-tab="history">修改紀錄</button></div><div class="actions"><a href="/" style="color:inherit"><button type="button">返回網站</button></a><a href="/api/logout" style="color:inherit"><button type="button">登出</button></a></div></div>
<section class="panel" id="winePanel"><h2>新增／修改酒款</h2><p class="hint">照片請另外上傳到 GitHub 根目錄；此處的「照片檔名」必須完全相同。</p><label>選擇既有酒款<select id="wineSelect"><option value="">＋ 新增酒款</option></select></label><form id="wineForm"><div class="fields"><label>中文酒名<input name="name" required></label><label>英文酒名<input name="englishName" required></label><label>酒莊<input name="winery"></label><label>國家<input name="country"></label><label>產區<input name="region"></label><label>葡萄品種<input name="grape"></label><label>參考價格<input name="price" placeholder="例如：NT$3,000–4,000"></label><label>照片檔名<input name="image" placeholder="例如：my-wine.png"></label><label>酒體（1–5）<input name="body" type="number" min="1" max="5"></label><label>單寧（1–5）<input name="tannin" type="number" min="1" max="5"></label><label>酸度（1–5）<input name="acidity" type="number" min="1" max="5"></label><label>是否有年份價格<select name="hasVintage"><option value="false">沒有</option><option value="true">有</option></select></label><label class="full">香氣描述<input name="aroma"></label><label class="full">建議搭餐<input name="pairing"></label><label class="full">酒款故事<textarea name="story"></textarea></label><label class="full">年份與價格（每行「年份: 價格」）<textarea name="vintages" placeholder="2021: NT$3,600&#10;2020: NT$3,200"></textarea></label><label>修改人員名稱<input id="wineEditor" required></label><label>本次修改備註<input id="wineNote" placeholder="例如：新增酒款、調整價格"></label></div><p><button class="primary">儲存酒款</button> <button type="button" id="deleteWine">刪除此酒款</button> <span class="status" id="wineStatus"></span></p></form><div class="list" id="wineList"></div></section>
<section class="panel hidden" id="wikiPanel"><h2>新增／修改百科</h2><label>選擇既有百科<select id="wikiSelect"><option value="">＋ 新增百科</option></select></label><form id="wikiForm"><div class="fields"><label>大分類<select name="category"><option>分級</option><option>名詞</option><option>產區</option><option>葡萄品種</option></select></label><label>小標題<input name="title" required></label><label>排序（數字越小越前）<input name="order" type="number" value="99"></label><label>修改人員名稱<input id="wikiEditor" required></label><label class="full">說明文字<textarea name="body" required></textarea></label><label class="full">本次修改備註<input id="wikiNote" placeholder="例如：新增納帕谷介紹"></label></div><p><button class="primary">儲存百科</button> <button type="button" id="deleteWiki">刪除此百科</button> <span class="status" id="wikiStatus"></span></p></form><div class="list" id="wikiList"></div></section>
<section class="panel hidden" id="historyPanel"><h2>最近修改紀錄</h2><div id="historyList">讀取中…</div></section></main>
<script>
let content={wines:[],wiki:[],vintagesByWine:{}};let selectedWine='',selectedWiki=-1;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(path,{credentials:'include',headers:{'content-type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'儲存失敗');return d}
function slug(v){return v.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||`wine-${Date.now()}`}
function setForm(form,data={}){[...form.elements].forEach(e=>{if(e.name)e.value=data[e.name]??''})}
function wineData(w){return {...w,hasVintage:String(Boolean(w.hasVintage)),vintages:(content.vintagesByWine[w.id]||[]).map(v=>`${v.year}: ${v.price}`).join('\n')}}
function renderWines(){const select=$('#wineSelect');select.innerHTML='<option value="">＋ 新增酒款</option>'+content.wines.sort((a,b)=>(a.order||0)-(b.order||0)).map(w=>`<option value="${esc(w.id)}">${esc(w.name)}｜${esc(w.englishName)}</option>`).join('');$('#wineList').innerHTML=content.wines.map(w=>`<div class="item"><span><b>${esc(w.name)}</b>｜${esc(w.englishName)}<br><small>${esc(w.image||'尚未填照片檔名')}</small></span><button data-wine="${esc(w.id)}">編輯</button></div>`).join('')||'<p class="hint">尚未有酒款。</p>';$('#wineList').querySelectorAll('[data-wine]').forEach(b=>b.onclick=()=>chooseWine(b.dataset.wine))}
function chooseWine(id){selectedWine=id;$('#wineSelect').value=id;const w=content.wines.find(x=>x.id===id);setForm($('#wineForm'),wineData(w||{}));$('#deleteWine').style.display=w?'inline-block':'none'}
function renderWiki(){const select=$('#wikiSelect');select.innerHTML='<option value="">＋ 新增百科</option>'+content.wiki.map((x,i)=>`<option value="${i}">${esc(x.category)}｜${esc(x.title)}</option>`).join('');$('#wikiList').innerHTML=content.wiki.map((x,i)=>`<div class="item"><span><b>${esc(x.category)}</b>｜${esc(x.title)}</span><button data-wiki="${i}">編輯</button></div>`).join('')||'<p class="hint">尚未有百科內容。</p>';$('#wikiList').querySelectorAll('[data-wiki]').forEach(b=>b.onclick=()=>chooseWiki(Number(b.dataset.wiki)))}
function chooseWiki(i){selectedWiki=i;$('#wikiSelect').value=i;setForm($('#wikiForm'),content.wiki[i]||{});$('#deleteWiki').style.display=i>=0?'inline-block':'none'}
async function save(summary,editor,note,status){await api('/api/content',{method:'PUT',body:JSON.stringify({content,editorName:editor,note,summary})});$(status).textContent='已儲存，正式網站已同步。';setTimeout(()=>$(status).textContent='',3500);await history()}
function history(){return api('/api/content/history').then(d=>{$('#historyList').innerHTML=d.history.map(x=>`<div class="history"><b>${esc(x.created_at)}</b>｜${esc(x.editor_name)}<br>${esc(x.summary)}${x.note?`<br><small>${esc(x.note)}</small>`:''}</div>`).join('')||'尚無紀錄。'})}
$('.tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['wine','wiki','history'].forEach(n=>$('#'+n+'Panel').classList.toggle('hidden',b.dataset.tab!==n))});
$('#wineSelect').onchange=e=>chooseWine(e.target.value);$('#wikiSelect').onchange=e=>chooseWiki(e.target.value);$('#wineForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),old=content.wines.find(w=>w.id===selectedWine),id=old?.id||slug(f.get('englishName')||f.get('name'));const w={id,order:old?.order||Math.max(0,...content.wines.map(x=>Number(x.order)||0))+1,name:f.get('name').trim(),englishName:f.get('englishName').trim(),winery:f.get('winery').trim(),country:f.get('country').trim(),region:f.get('region').trim(),grape:f.get('grape').trim(),price:f.get('price').trim(),image:f.get('image').trim(),body:Number(f.get('body'))||null,tannin:Number(f.get('tannin'))||null,acidity:Number(f.get('acidity'))||null,aroma:f.get('aroma').trim(),pairing:f.get('pairing').trim(),story:f.get('story').trim(),hasVintage:f.get('hasVintage')==='true'};if(old)Object.assign(old,w);else content.wines.push(w);const vs=f.get('vintages').split(/\r?\n/).map(x=>x.split(':')).filter(x=>x.length>1&&x[0].trim()&&x.slice(1).join(':').trim()).map(x=>({year:x[0].trim(),price:x.slice(1).join(':').trim()}));if(vs.length)content.vintagesByWine[id]=vs;else delete content.vintagesByWine[id];selectedWine=id;await save(`${old?'修改':'新增'}酒款：${w.name}`,f.get('wineEditor'),f.get('wineNote'),'#wineStatus');renderWines();chooseWine(id)};
$('#deleteWine').onclick=async()=>{const w=content.wines.find(x=>x.id===selectedWine);if(!w||!confirm(`確定刪除「${w.name}」？`))return;content.wines=content.wines.filter(x=>x.id!==w.id);delete content.vintagesByWine[w.id];await save(`刪除酒款：${w.name}`,prompt('請輸入操作人員名稱')||'未填寫','','#wineStatus');selectedWine='';renderWines();chooseWine('')};
$('#wikiForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),old=content.wiki[selectedWiki],item={category:f.get('category'),title:f.get('title').trim(),body:f.get('body').trim(),order:Number(f.get('order'))||99};if(old)Object.assign(old,item);else{content.wiki.push(item);selectedWiki=content.wiki.length-1}content.wiki.sort((a,b)=>a.category.localeCompare(b.category,'zh-Hant')||a.order-b.order);selectedWiki=content.wiki.indexOf(old||item);await save(`${old?'修改':'新增'}百科：${item.title}`,f.get('wikiEditor'),f.get('wikiNote'),'#wikiStatus');renderWiki();chooseWiki(selectedWiki)};
$('#deleteWiki').onclick=async()=>{const x=content.wiki[selectedWiki];if(!x||!confirm(`確定刪除「${x.title}」？`))return;content.wiki.splice(selectedWiki,1);await save(`刪除百科：${x.title}`,prompt('請輸入操作人員名稱')||'未填寫','','#wikiStatus');selectedWiki=-1;renderWiki();chooseWiki(-1)};
(async()=>{content=await api('/api/content');renderWines();renderWiki();chooseWine('');chooseWiki(-1);await history()})().catch(e=>document.body.innerHTML=`<main class="wrap"><h1>無法開啟後台</h1><p>${esc(e.message)}</p></main>`);
</script></html>
